name: CI and security checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache OWASP Dependency-Check database
        uses: actions/cache@v4
        with:
          path: .cache/dependency-check
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run tests, SpotBugs SAST and OWASP Dependency-Check SCA
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B verify -Psecurity -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          if-no-files-found: warn
          path: |
            target/spotbugs*.xml
            target/spotbugs*.html
            target/reports/spotbugs.html
            target/dependency-check-report.*
            target/surefire-reports/**
